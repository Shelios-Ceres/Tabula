<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海上落日</title>
<!-- Infinite Canvas waiting animation: 海上落日. Original work for the Infinite Canvas client, no libraries. -->
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ede4; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c'), x = canvas.getContext('2d');
const PAPER = '#f3ede4', PAINT_MS = 10000, HOLD_MS = 2600;
let W, H, U, queue, next, start, fade;
let seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
function rnd() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const r = (a, b) => a + (b - a) * rnd();
const pick = (list) => list[Math.floor(rnd() * list.length)];
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
// Paint something at a time (ms) on the timeline.
const at = (time, draw) => queue.push({ time, draw });
function grain(amount, dark) {
  for (let i = 0; i < W * H / 260 * amount; i++) {
    x.fillStyle = dark ? 'rgba(255,255,255,' + r(0.01, 0.05) + ')' : 'rgba(90,70,40,' + r(0.01, 0.05) + ')';
    x.fillRect(r(0, W), r(0, H), r(0.5, 1.6) * U, r(0.5, 1.6) * U);
  }
}
function begin() {
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  queue = []; paint(); queue.sort((a, b) => a.time - b.time);
  next = 0; start = performance.now(); fade = 0;
  // ?at=ms paints straight to that moment (previews and stills).
  const jump = +new URLSearchParams(location.search).get('at') || 0;
  while (jump && next < queue.length && queue[next].time <= jump) { x.save(); queue[next++].draw(); x.restore(); }
  start -= jump;
}
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = Math.max(1, Math.round(innerWidth * d)); H = canvas.height = Math.max(1, Math.round(innerHeight * d));
  U = Math.min(W, H) / 400;
  begin();
}
function frame(now) {
  const t = now - start;
  while (next < queue.length && queue[next].time <= t) { x.save(); queue[next++].draw(); x.restore(); }
  if (next >= queue.length && t > PAINT_MS + HOLD_MS) {
    x.globalAlpha = 0.07; x.fillStyle = PAPER; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
    if (++fade > 45) begin();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// Impressionist dabs: the sky laid in from the top, the sun, then the sea with a broken golden path under it.
function lerpHex(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t);
  return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}
function ramp(stops, t) {
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) return lerpHex(stops[i - 1][1], stops[i][1], (t - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
  return stops[stops.length - 1][1];
}
function dab(cx, cy, len, thick, color, alpha, tilt) {
  x.fillStyle = rgba(color, alpha); x.beginPath(); x.ellipse(cx, cy, len, thick, tilt, 0, 6.28); x.fill();
}
function paint() {
  grain(1);
  const horizon = H * r(0.5, 0.6), sun = [r(0.3, 0.7) * W, horizon - r(0.06, 0.16) * H], sunR = r(18, 28) * U;
  const sky = pick([
    [[0, '#3d4a8c'], [0.45, '#b06aa0'], [0.8, '#f08c6a'], [1, '#f7c46a']],
    [[0, '#27507a'], [0.5, '#8a8fc4'], [0.85, '#f2a2a0'], [1, '#f6d58e']],
    [[0, '#4b3a78'], [0.4, '#d0607a'], [0.85, '#f59a52'], [1, '#fbd06c']],
  ]);
  const sea = [[0, '#c98a6c'], [0.25, '#55658f'], [1, '#1f2c4f']];
  const rows = 40, perRow = 78;
  // The sky, row by row from the top.
  for (let row = 0; row < rows; row++) {
    const v = row / (rows - 1), y = v * horizon;
    at(200 + row * 110, () => {
      for (let i = 0; i < perRow; i++) {
        const px = rnd() * W, py = y + gauss() * horizon / rows;
        dab(px, py, r(10, 22) * U, r(3, 5.5) * U, ramp(sky, Math.min(1, Math.max(0, py / horizon + gauss() * 0.04))), r(0.45, 0.75), r(-0.12, 0.12));
      }
    });
  }
  // The sun and its glow.
  at(4700, () => {
    const g = x.createRadialGradient(sun[0], sun[1], 0, sun[0], sun[1], sunR * 5);
    g.addColorStop(0, 'rgba(255,214,140,0.55)'); g.addColorStop(1, 'rgba(255,214,140,0)');
    x.fillStyle = g; x.fillRect(sun[0] - sunR * 5, sun[1] - sunR * 5, sunR * 10, sunR * 10);
  });
  for (let k = 0; k < 24; k++) at(4750 + k * 25, () => dab(sun[0] + gauss() * sunR * 0.3, sun[1] + gauss() * sunR * 0.3, sunR * r(0.6, 1), sunR * r(0.5, 0.9), pick(['#f2603c', '#f47a3a', '#f9a64a']), 0.35, r(0, 3.14)));
  // A low island on the horizon.
  const island = [r(0.05, 0.6) * W, r(0.2, 0.4) * W];
  at(5400, () => {
    x.fillStyle = 'rgba(58,48,72,0.75)'; x.beginPath(); x.moveTo(island[0], horizon);
    x.quadraticCurveTo(island[0] + island[1] * 0.4, horizon - r(10, 22) * U, island[0] + island[1], horizon); x.fill();
  });
  // The sea, then the sun's broken path across it.
  for (let row = 0; row < rows; row++) {
    const v = row / (rows - 1), y = horizon + v * (H - horizon);
    at(5500 + row * 85, () => {
      for (let i = 0; i < perRow; i++) {
        const px = rnd() * W, py = y + gauss() * (H - horizon) / rows;
        dab(px, py, r(12, 26) * U * (0.6 + v), r(2.2, 4) * U, ramp(sea, Math.min(1, Math.max(0, (py - horizon) / (H - horizon) + gauss() * 0.05))), r(0.5, 0.8), r(-0.05, 0.05));
      }
    });
  }
  for (let k = 0; k < 70; k++) at(8900 + k * 14, () => {
    const v = rnd() ** 1.4, py = horizon + 2 * U + v * (H - horizon), spread = sunR * (0.6 + v * 3);
    dab(sun[0] + gauss() * spread, py, r(6, 16) * U * (0.6 + v), r(1.2, 2.4) * U, pick(['#ffd27a', '#ffb45e', '#ffe6a8']), r(0.5, 0.85), 0);
  });
}

</script>
</body>
</html>
