<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竹影</title>
<!-- Infinite Canvas waiting animation: 竹影. Original work for the Infinite Canvas client, no libraries. -->
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #f1ece1; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c'), x = canvas.getContext('2d');
const PAPER = '#f1ece1', PAINT_MS = 10000, HOLD_MS = 2600;
let W, H, U, queue, next, start, fade;
let seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
function rnd() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const r = (a, b) => a + (b - a) * rnd();
const pick = (list) => list[Math.floor(rnd() * list.length)];
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
// Paint something at a time (ms) on the timeline.
const at = (time, draw) => queue.push({ time, draw });
function grain(amount, dark) {
  for (let i = 0; i < W * H / 260 * amount; i++) {
    x.fillStyle = dark ? 'rgba(255,255,255,' + r(0.01, 0.05) + ')' : 'rgba(90,70,40,' + r(0.01, 0.05) + ')';
    x.fillRect(r(0, W), r(0, H), r(0.5, 1.6) * U, r(0.5, 1.6) * U);
  }
}
function begin() {
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  queue = []; paint(); queue.sort((a, b) => a.time - b.time);
  next = 0; start = performance.now(); fade = 0;
  // ?at=ms paints straight to that moment (previews and stills).
  const jump = +new URLSearchParams(location.search).get('at') || 0;
  while (jump && next < queue.length && queue[next].time <= jump) { x.save(); queue[next++].draw(); x.restore(); }
  start -= jump;
}
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = Math.max(1, Math.round(innerWidth * d)); H = canvas.height = Math.max(1, Math.round(innerHeight * d));
  U = Math.min(W, H) / 400;
  begin();
}
function frame(now) {
  const t = now - start;
  while (next < queue.length && queue[next].time <= t) { x.save(); queue[next++].draw(); x.restore(); }
  if (next >= queue.length && t > PAINT_MS + HOLD_MS) {
    x.globalAlpha = 0.07; x.fillStyle = PAPER; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
    if (++fade > 45) begin();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// Ink bamboo: stalks grow segment by segment from the bottom, joints are dabbed, then leaves flick out in clusters.
function leafShape(px, py, len, angle, ink) {
  const w = len * r(0.12, 0.17), c = Math.cos(angle), s = Math.sin(angle);
  const P = (u, v) => [px + u * c - v * s, py + u * s + v * c];
  x.fillStyle = ink; x.beginPath();
  x.moveTo(...P(0, 0));
  x.quadraticCurveTo(...P(len * 0.35, w), ...P(len, 0));
  x.quadraticCurveTo(...P(len * 0.4, -w * 0.7), ...P(0, 0));
  x.fill();
}
function stalk(x0, width, ink, alpha, t0, leafy) {
  const segs = Math.floor(r(6, 9)), lean = r(-0.08, 0.08);
  let y = H + 10 * U, cx = x0, time = t0;
  for (let i = 0; i < segs; i++) {
    const len = r(48, 78) * U * (1 - i * 0.04), top = y - len, nx = cx + lean * len;
    const [ax, ay, bx, by] = [cx, y, nx, top];
    // The segment, brushed upward in a few passes for a dry, streaky edge.
    for (let p = 0; p < 6; p++) at(time + p * 60, () => {
      x.strokeStyle = `rgba(${ink},${alpha * r(0.25, 0.45)})`; x.lineCap = 'butt';
      x.lineWidth = width * U * r(0.55, 1); const off = r(-0.3, 0.3) * width * U;
      x.beginPath(); x.moveTo(ax + off, ay - 2 * U); x.lineTo(bx + off, by + 3 * U); x.stroke();
    });
    // The joint.
    at(time + 400, () => {
      x.strokeStyle = `rgba(${ink},${alpha})`; x.lineWidth = 1.8 * U; x.lineCap = 'round';
      x.beginPath(); x.moveTo(bx - width * 0.7 * U, by + U); x.quadraticCurveTo(bx, by - 1.5 * U, bx + width * 0.7 * U, by + U); x.stroke();
    });
    if (leafy && i > 1 && rnd() < 0.6) {
      const n = Math.floor(r(3, 6)), side = rnd() < 0.5 ? -1 : 1;
      for (let k = 0; k < n; k++) at(time + 700 + k * 110, () =>
        leafShape(bx, by, r(36, 62) * U, (side < 0 ? Math.PI : 0) + side * r(0.15, 0.9) + r(-0.2, 0.2), `rgba(${ink},${alpha * r(0.7, 0.95)})`));
    }
    y = top; cx = nx; time += 520;
  }
}
function paint() {
  grain(1.3);
  at(0, () => {
    const g = x.createRadialGradient(W * 0.6, H * 0.4, 0, W * 0.6, H * 0.4, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(255,255,255,0.4)'); g.addColorStop(1, 'rgba(200,190,170,0.25)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  });
  // Pale stalks behind, then the dark ones in front.
  for (let i = 0; i < 3; i++) stalk(r(0.1, 0.9) * W, r(7, 10), '70,78,72', 0.35, 300 + i * 500, true);
  for (let i = 0; i < 3; i++) stalk(r(0.15, 0.85) * W, r(10, 14), '22,26,24', 0.9, 2200 + i * 700, true);
  at(9700, () => {
    const s = 20 * U, sx = 16 * U, sy = H - s - 16 * U;
    x.fillStyle = 'rgba(178,40,32,0.88)'; x.fillRect(sx, sy, s, s);
    x.fillStyle = '#f6ecdc'; x.font = `${s * 0.42}px "KaiTi", "STKaiti", serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('竹', sx + s / 2, sy + s * 0.3); x.fillText('影', sx + s / 2, sy + s * 0.72);
  });
}

</script>
</body>
</html>
