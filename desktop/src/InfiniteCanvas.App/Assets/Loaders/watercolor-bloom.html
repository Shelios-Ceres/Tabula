<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水彩花开</title>
<!-- Infinite Canvas waiting animation: 水彩花开. Original work for the Infinite Canvas client, no libraries. -->
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f2ea; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c'), x = canvas.getContext('2d');
const PAPER = '#f7f2ea', PAINT_MS = 10000, HOLD_MS = 2600;
let W, H, U, queue, next, start, fade;
let seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
function rnd() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const r = (a, b) => a + (b - a) * rnd();
const pick = (list) => list[Math.floor(rnd() * list.length)];
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
// Paint something at a time (ms) on the timeline.
const at = (time, draw) => queue.push({ time, draw });
function grain(amount, dark) {
  for (let i = 0; i < W * H / 260 * amount; i++) {
    x.fillStyle = dark ? 'rgba(255,255,255,' + r(0.01, 0.05) + ')' : 'rgba(90,70,40,' + r(0.01, 0.05) + ')';
    x.fillRect(r(0, W), r(0, H), r(0.5, 1.6) * U, r(0.5, 1.6) * U);
  }
}
function begin() {
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  queue = []; paint(); queue.sort((a, b) => a.time - b.time);
  next = 0; start = performance.now(); fade = 0;
  // ?at=ms paints straight to that moment (previews and stills).
  const jump = +new URLSearchParams(location.search).get('at') || 0;
  while (jump && next < queue.length && queue[next].time <= jump) { x.save(); queue[next++].draw(); x.restore(); }
  start -= jump;
}
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = Math.max(1, Math.round(innerWidth * d)); H = canvas.height = Math.max(1, Math.round(innerHeight * d));
  U = Math.min(W, H) / 400;
  begin();
}
function frame(now) {
  const t = now - start;
  while (next < queue.length && queue[next].time <= t) { x.save(); queue[next++].draw(); x.restore(); }
  if (next >= queue.length && t > PAINT_MS + HOLD_MS) {
    x.globalAlpha = 0.07; x.fillStyle = PAPER; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
    if (++fade > 45) begin();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// Wet-on-wet blooms: each flower is dozens of faint, slightly different deformed blobs laid one over another.
function deform(points, depth, spread) {
  let pts = points;
  for (let d = 0; d < depth; d++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay, av] = pts[i], [bx, by, bv] = pts[(i + 1) % pts.length];
      const len = Math.hypot(bx - ax, by - ay), v = (av + bv) / 2;
      out.push([ax, ay, av], [(ax + bx) / 2 + gauss() * len * spread * v, (ay + by) / 2 + gauss() * len * spread * v, v * r(0.75, 1.15)]);
    }
    pts = out;
  }
  return pts;
}
function blob(cx, cy, rad, sides, stretch = 1, angle = 0) {
  return Array.from({ length: sides }, (_, i) => {
    const t = i / sides * 6.28, px = Math.cos(t) * rad, py = Math.sin(t) * rad * stretch;
    return [cx + px * Math.cos(angle) - py * Math.sin(angle), cy + px * Math.sin(angle) + py * Math.cos(angle), r(0.6, 1.4)];
  });
}
function fillShape(pts, color, alpha) {
  x.fillStyle = rgba(color, alpha); x.beginPath(); x.moveTo(pts[0][0], pts[0][1]);
  for (const p of pts) x.lineTo(p[0], p[1]);
  x.closePath(); x.fill();
}
function paint() {
  grain(1.4);
  const palettes = [['#e9567b', '#f39ab0', '#f6c453'], ['#7a5cd6', '#c49bf2', '#f29fb5'], ['#f07a3f', '#f5b25b', '#e45b6c'], ['#3b82c4', '#8cc6ec', '#f2a7c0']];
  const colors = pick(palettes), leaf = pick(['#5c9b62', '#6faf7a', '#4f8a6d']);
  const flowers = Array.from({ length: Math.floor(r(5, 8)) }, () => ({ cx: r(0.12, 0.88) * W, cy: r(0.15, 0.6) * H, rad: r(40, 72) * U, color: pick(colors) }));
  // Stems first, as thin strokes growing down from each flower.
  flowers.forEach((f, i) => {
    const end = [f.cx + r(-60, 60) * U, H + 10 * U], ctrl = [f.cx + r(-50, 50) * U, (f.cy + H) / 2];
    const segs = 24;
    for (let s = 0; s < segs; s++) at(300 + i * 120 + s * 40, () => {
      const q = (t) => [(1 - t) ** 2 * end[0] + 2 * (1 - t) * t * ctrl[0] + t * t * f.cx, (1 - t) ** 2 * end[1] + 2 * (1 - t) * t * ctrl[1] + t * t * f.cy];
      const [ax, ay] = q(s / segs), [bx, by] = q((s + 1) / segs);
      x.strokeStyle = rgba(leaf, 0.55); x.lineWidth = r(1.2, 2.2) * U; x.lineCap = 'round';
      x.beginPath(); x.moveTo(ax, ay); x.lineTo(bx, by); x.stroke();
    });
    // Two leaves along the stem.
    for (let l = 0; l < 2; l++) {
      const t = r(0.35, 0.75), lx = (1 - t) ** 2 * end[0] + 2 * (1 - t) * t * ctrl[0] + t * t * f.cx, ly = (1 - t) ** 2 * end[1] + 2 * (1 - t) * t * ctrl[1] + t * t * f.cy;
      const side = l ? 1 : -1, base = deform(blob(lx + side * 26 * U, ly, 32 * U, 8, 0.35, side * r(0.3, 0.8)), 3, 0.5);
      for (let k = 0; k < 22; k++) at(1600 + i * 200 + l * 300 + k * 45, () => fillShape(deform(base, 3, 0.35), leaf, 0.045));
    }
  });
  // The blooms: each grows from a small, dense centre to its full soft edge.
  flowers.forEach((f, i) => {
    const base = deform(blob(f.cx, f.cy, f.rad, 10), 3, 0.6);
    const layers = 44;
    for (let k = 0; k < layers; k++) at(3200 + i * 520 + k * 60, () => {
      const grow = 0.45 + 0.55 * (k / layers);
      const scaled = base.map(([px, py, v]) => [f.cx + (px - f.cx) * grow, f.cy + (py - f.cy) * grow, v]);
      fillShape(deform(scaled, 3, 0.3), f.color, 0.05);
    });
    at(3200 + i * 520 + layers * 60 + 200, () => {
      for (let d = 0; d < 7; d++) fillShape(deform(blob(f.cx + gauss() * 3 * U, f.cy + gauss() * 3 * U, f.rad * 0.18, 8), 2, 0.4), '#5a3a2a', 0.12);
    });
  });
  // Splatter.
  at(9400, () => {
    for (let i = 0; i < 60; i++) { x.fillStyle = rgba(pick(colors), r(0.15, 0.45)); x.beginPath(); x.arc(r(0, W), r(0, H), r(0.5, 3) * U, 0, 6.28); x.fill(); }
  });
}

</script>
</body>
</html>
