<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸船溪流</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f2f4ee; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div role="img" aria-label="水彩手绘的雨后溪流里，一只鹅黄色折纸小船载着嫩绿小叶随波起伏，岸边野草与蒲公英随风摇曳。">
<canvas aria-hidden="true" id="paper"></canvas>
<canvas aria-hidden="true" id="sketch"></canvas>
</div>
<script>
'use strict';
const paper = document.getElementById('paper').getContext('2d');
const sketch = document.getElementById('sketch').getContext('2d');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const tau = Math.PI * 2;
let left, topEdge, right, bottom, frame;

function rng(seed) {
  let s = seed | 0;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const paperTile = document.createElement('canvas');
paperTile.width = paperTile.height = 128;
const pt = paperTile.getContext('2d');
const pr = rng(77);
for (let i = 0; i < 2400; i++) {
  pt.fillStyle = i % 3 ? 'rgba(92,110,118,0.04)' : 'rgba(255,254,248,0.09)';
  pt.fillRect(pr() * 128, pr() * 128, .7 + pr() * 1.5, .6 + pr() * 1.1);
}

function inkLine(c, pts, color = '#334048', width = 1.4, seed = 1, jitter = .85, passes = 2) {
  const r = rng(seed);
  for (let p = 0; p < passes; p++) {
    c.beginPath();
    pts.forEach(([x, y], idx) => {
      const jx = (r() - .5) * jitter * (p ? 1.3 : 1);
      const jy = (r() - .5) * jitter * (p ? 1.3 : 1);
      if (idx === 0) c.moveTo(x + jx, y + jy);
      else c.lineTo(x + jx, y + jy);
    });
    c.strokeStyle = color;
    c.globalAlpha = p === 0 ? .88 : .32;
    c.lineWidth = p === 0 ? width : width * .62;
    c.stroke();
  }
  c.globalAlpha = 1;
}

function waterBlob(c, pts, color, seed = 7, alpha = .26, layers = 3) {
  const r = rng(seed);
  for (let l = 0; l < layers; l++) {
    c.beginPath();
    pts.forEach(([x, y], i) => {
      const dx = (r() - .5) * 3.6, dy = (r() - .5) * 3.2;
      if (i === 0) c.moveTo(x + dx, y + dy);
      else c.lineTo(x + dx, y + dy);
    });
    c.closePath();
    c.fillStyle = color;
    c.globalAlpha = alpha * (1 - l * .16);
    c.fill();
    if (l === 0) {
      c.strokeStyle = color;
      c.globalAlpha = alpha * .5;
      c.lineWidth = 1.6;
      c.stroke();
    }
  }
  c.globalAlpha = 1;
}

function sampleEllipse(cx, cy, rx, ry, n = 16, rot = 0) {
  const out = [], cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * tau;
    const lx = Math.cos(a) * rx, ly = Math.sin(a) * ry;
    out.push([cx + lx * cr - ly * sr, cy + lx * sr + ly * cr]);
  }
  return out;
}

function drawPaperScene() {
  const c = paper;
  c.fillStyle = '#f4f6f0';
  c.fillRect(left, topEdge, right - left, bottom - topEdge);

  // Soft wet-on-wet cerulean watercolor stream winding diagonally across the page.
  const streamTop = [
    [left - 20, 88], [76, 82], [156, 98], [244, 92], [330, 80], [right + 20, 86],
    [right + 20, 224], [320, 232], [234, 218], [148, 232], [68, 220], [left - 20, 226]
  ];
  waterBlob(c, streamTop, '#9bc7de', 201, .34, 3);
  waterBlob(c, [
    [left - 20, 114], [100, 108], [204, 122], [312, 110], [right + 20, 116],
    [right + 20, 198], [308, 206], [198, 192], [94, 204], [left - 20, 198]
  ], '#6ea5c7', 205, .24, 3);
  // Bright sunlit reflections left intentionally pale like loose dry-brush water gleams.
  const gleams = [
    [[74, 134], [116, 128], [156, 135], [120, 141]],
    [[168, 168], [216, 163], [248, 170], [202, 175]],
    [[246, 128], [292, 122], [326, 129], [286, 134]],
    [[102, 186], [148, 182], [174, 188], [134, 191]]
  ];
  gleams.forEach((g, idx) => waterBlob(c, g, '#f7f9f5', 210 + idx * 3, .36, 2));

  // Upper mossy riverbank wash.
  waterBlob(c, [
    [left - 16, topEdge - 10], [right + 16, topEdge - 10], [right + 16, 86],
    [318, 82], [236, 96], [148, 99], [72, 84], [left - 16, 90]
  ], '#a4c496', 220, .34, 3);
  waterBlob(c, [
    [left - 16, topEdge - 10], [right + 16, topEdge - 10], [right + 16, 62],
    [280, 68], [180, 74], [88, 62], [left - 16, 70]
  ], '#85ae7f', 222, .22, 2);

  // Lower foreground meadow bank wash.
  waterBlob(c, [
    [left - 16, 226], [76, 218], [156, 232], [242, 218], [326, 230], [right + 16, 222],
    [right + 16, bottom + 12], [left - 16, bottom + 12]
  ], '#a6c493', 230, .36, 3);

  // Loose fountain-pen shoreline strokes.
  inkLine(c, [[left, 88], [76, 83], [156, 98], [244, 92], [330, 81], [right, 86]], '#435449', 1.35, 235, 1.0, 2);
  inkLine(c, [[left, 225], [72, 219], [152, 231], [238, 219], [322, 230], [right, 223]], '#435449', 1.35, 237, 1.0, 2);

  // Smooth river pebbles drawn with ink & ochre/slate watercolor dabs.
  const stones = [
    [94, 86, 15, 8.5, -.1, '#b8a995'], [114, 92, 9.5, 5.8, .15, '#99a6a9'],
    [286, 84, 14, 7.5, .1, '#b3a797'], [266, 224, 16, 8.5, -.12, '#a79f93'],
    [288, 228, 10, 6, .2, '#8fa1a6'], [112, 226, 13, 7, .08, '#bca990']
  ];
  for (let i = 0; i < stones.length; i++) {
    const [x, y, rx, ry, rot, col] = stones[i];
    const pts = sampleEllipse(x, y, rx, ry, 14, rot);
    waterBlob(c, pts, col, 240 + i * 3, .45, 2);
    inkLine(c, pts, '#42494d', 1.2, 241 + i * 3, .6, 2);
  }

  // Tiny wild daisies scattered along the mossy banks.
  const flowers = [[76, 66, '#f6d86e'], [246, 68, '#f0a69c'], [316, 64, '#f6d86e'], [84, 244, '#f0a69c'], [238, 246, '#f6d86e']];
  for (let i = 0; i < flowers.length; i++) {
    const [fx, fy, col] = flowers[i];
    for (let k = 0; k < 5; k++) {
      const a = k * tau / 5 + i;
      waterBlob(c, sampleEllipse(fx + Math.cos(a) * 4.2, fy + Math.sin(a) * 4.2, 3.2, 2.2, 8, a), '#fffef9', 260 + i * 7 + k, .75, 1);
    }
    waterBlob(c, sampleEllipse(fx, fy, 2.5, 2.5, 8), col, 265 + i, .85, 1);
  }

  c.fillStyle = c.createPattern(paperTile, 'repeat');
  c.fillRect(left, topEdge, right - left, bottom - topEdge);
}

function drawGrassBlade(c, x, y, h, lean, col, seed) {
  const tipX = x + lean, tipY = y - h;
  const cx = x + lean * .42, cy = y - h * .55;
  const pts = [];
  for (let i = 0; i <= 7; i++) {
    const u = i / 7, m = 1 - u;
    pts.push([m * m * x + 2 * m * u * cx + u * u * tipX, m * m * y + 2 * m * u * cy + u * u * tipY]);
  }
  inkLine(c, pts, col, 1.3, seed, .55, 1);
}

function drawPaperBoat(c, x, y, tilt, boil) {
  c.save();
  c.translate(x, y);
  c.rotate(tilt);
  // Soft cerulean reflection beneath the folded hull.
  waterBlob(c, [[-34, 8], [34, 8], [24, 18], [-22, 18]], '#4d7e9e', 501, .28, 2);

  // Back sail triangle (warm cream-lemon paper).
  const sail = [[-16, -2], [1, -36], [17, -2]];
  waterBlob(c, sail, '#fae6a5', 505, .78, 2);
  // Shaded right facet of the folded center mast.
  waterBlob(c, [[1, -36], [17, -2], [1, -2]], '#e6be6a', 506, .48, 2);

  // Main folded origami hull.
  const hull = [[-36, -6], [-12, -2], [14, -2], [36, -7], [24, 9], [-24, 9]];
  waterBlob(c, hull, '#f7d97e', 508, .78, 2);
  waterBlob(c, [[-36, -6], [-24, 9], [24, 9], [2, 1]], '#e2b458', 509, .38, 2);

  // Tiny fresh green clover leaf tucked aboard like a passenger.
  waterBlob(c, sampleEllipse(-9, -10, 4.5, 3.2, 8, -.4), '#72a86e', 512, .7, 2);
  waterBlob(c, sampleEllipse(-5, -14, 4.2, 3.0, 8, .5), '#88bc7e', 513, .7, 2);

  // Fountain-pen crisp origami creases with gentle hand-drawn boil.
  inkLine(c, [[-16, -2], [1, -36], [17, -2]], '#3a342e', 1.45, 520 + boil * 7, .7, 2);
  inkLine(c, [[1, -36], [1, -2]], '#4a4037', 1.1, 521 + boil * 5, .5, 1);
  inkLine(c, [[-36, -6], [-24, 9], [24, 9], [36, -7], [16, -2], [-16, -2], [-36, -6]], '#3a342e', 1.5, 522 + boil * 11, .75, 2);
  inkLine(c, [[-35, -6], [1, 2], [35, -7]], '#5c4d3e', 1.0, 523 + boil * 3, .55, 1);
  c.restore();
}

function drawMotion(t) {
  const c = sketch;
  const boil = reducedMotion.matches ? 0 : Math.floor(t * 5) % 4;

  // Flowing hand-sketched water current lines drifting rightward.
  for (let i = 0; i < 11; i++) {
    const p = (t / (4.8 + (i % 3) * 1.1) + i * .19) % 1;
    const x = left - 45 + p * (right - left + 95);
    const y = 108 + ((i * 31) % 94);
    const alpha = Math.sin(p * Math.PI) * .48;
    c.save();
    c.globalAlpha = alpha;
    inkLine(c, [[x, y], [x + 14, y - 1.5], [x + 28, y + .8], [x + 42, y - .6]], i % 2 ? '#ffffff' : '#4a80a3', 1.2, 600 + i, .45, 1);
    c.restore();
  }

  // Origami paper boat bobbing gracefully near center stream.
  const bx = 198 + Math.sin(t * .75) * 14;
  const by = 158 + Math.sin(t * 2.1) * 4.2 + Math.cos(t * 1.3) * 1.6;
  const tilt = Math.sin(t * 2.1 - .5) * .085;

  // Expanding hand-drawn water ripples around the boat.
  for (let k = 0; k < 2; k++) {
    const rp = (t / 2.6 + k * .5) % 1;
    const pts = sampleEllipse(bx - rp * 22, by + 8, 24 + rp * 34, 6 + rp * 11, 20);
    c.save();
    c.globalAlpha = (1 - rp) * .52;
    inkLine(c, pts, '#ffffff', 1.25 - rp * .5, 620 + k + boil * 3, .55, 1);
    c.restore();
  }

  drawPaperBoat(c, bx, by, tilt, boil);

  // Swaying bank reeds & grasses.
  const wind = Math.sin(t * 1.5) * 6.5 + Math.sin(t * 2.7) * 2;
  const tufts = [
    [62, 86, 26, -6], [68, 88, 32, 3], [74, 86, 22, 8],
    [324, 84, 28, -5], [332, 86, 34, 4], [338, 84, 21, 9],
    [136, 244, 26, -5], [142, 246, 31, 4], [306, 244, 28, -4], [314, 246, 24, 7]
  ];
  tufts.forEach(([x, y, h, baseLean], idx) => {
    drawGrassBlade(c, x, y, h, baseLean + wind * (h / 28), '#466449', 640 + idx + boil);
  });

  // Floating white dandelion seeds drifting lazily across the stream.
  for (let i = 0; i < 6; i++) {
    const p = (t / (7.2 + (i % 3) * 1.4) + i * .23) % 1;
    const sx = left - 20 + p * (right - left + 40);
    const sy = 56 + ((i * 41) % 140) + Math.sin(t * 1.8 + i * 2) * 12;
    const alpha = Math.sin(p * Math.PI) * .72;
    c.save();
    c.globalAlpha = alpha;
    c.translate(sx, sy);
    c.rotate(Math.sin(t * 2 + i) * .35);
    inkLine(c, [[0, 0], [0, 7]], '#5c6662', .85, 680 + i, .2, 1);
    for (let k = -2; k <= 2; k++) {
      inkLine(c, [[0, 0], [k * 2.4, -4.5 + Math.abs(k) * .7]], '#ffffff', .95, 690 + i + k, .2, 1);
    }
    c.restore();
  }
}

function redraw(now) {
  sketch.clearRect(left - 1, topEdge - 1, right - left + 2, bottom - topEdge + 2);
  drawMotion(reducedMotion.matches ? 1.4 : now / 1000);
  if (!document.hidden && !reducedMotion.matches) frame = requestAnimationFrame(redraw);
}

function refresh() {
  cancelAnimationFrame(frame);
  if (!innerWidth || !innerHeight) return;
  const density = Math.min(devicePixelRatio || 1, 2);
  const scale = Math.min(innerWidth / 328, innerHeight / 258);
  const halfWidth = innerWidth / (2 * scale), halfHeight = innerHeight / (2 * scale);
  left = 200 - halfWidth; right = 200 + halfWidth;
  topEdge = 150 - halfHeight; bottom = 150 + halfHeight;
  for (const ctx of [paper, sketch]) {
    ctx.canvas.width = Math.round(innerWidth * density);
    ctx.canvas.height = Math.round(innerHeight * density);
    const sx = ctx.canvas.width / (right - left), sy = ctx.canvas.height / (bottom - topEdge);
    ctx.setTransform(sx, 0, 0, sy, -left * sx, -topEdge * sy);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  drawPaperScene();
  redraw(performance.now());
}
addEventListener('resize', refresh);
document.addEventListener('visibilitychange', refresh);
reducedMotion.addEventListener('change', refresh);
refresh();
</script>
</body>
</html>
