<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山谷夜车</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #655171; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div role="img" aria-label="杏黄色月亮挂在层叠的紫色山谷上，一列亮着灯的蒸汽火车穿过石拱桥。">
<canvas aria-hidden="true" id="print"></canvas>
<canvas aria-hidden="true" id="motion"></canvas>
</div>
<script>
'use strict';
const print = document.getElementById('print').getContext('2d');
const motion = document.getElementById('motion').getContext('2d');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const tau = Math.PI * 2;
let left, topEdge, right, bottom, frame;

function shape(ctx, path, fill, stroke, width = 1) {
  const outline = new Path2D(path);
  if (fill) { ctx.fillStyle = fill; ctx.fill(outline); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(outline); }
}

function oval(ctx, x, y, rx, ry, fill) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, tau);
  ctx.fillStyle = fill;
  ctx.fill();
}

function wash(ctx, y1, y2, stops) {
  const gradient = ctx.createLinearGradient(0, y1, 0, y2);
  for (const [offset, color] of stops) gradient.addColorStop(offset, color);
  return gradient;
}

// A small, stationary two-ink grain tile gives flat colours the tooth of a paper print.
const grainTile = document.createElement('canvas');
grainTile.width = grainTile.height = 96;
const grain = grainTile.getContext('2d');
for (let i = 0; i < 1800; i++) {
  grain.fillStyle = i % 3 ? '#172e3720' : '#fff0c825';
  grain.fillRect(Math.random() * 96, Math.random() * 96, .5 + Math.random(), .5 + Math.random());
}

const bridge = '#342d43', mortar = '#70596a', windowLight = '#ffcf88';
const deck = 184;

function fir(c, x, y, size, color) {
  c.save(); c.translate(x, y); c.scale(size, size);
  shape(c, 'M0 0 L-2 0 -2 -4 -9 -4 -5 -11 -8 -10 -3 -18 -5 -17 0 -29 4 -17 3 -18 8 -10 5 -11 10 -4 2 -4 2 0Z', color);
  c.restore();
}

function drawPrint() {
  const c = print;
  c.fillStyle = wash(c, topEdge, 206, [[0, '#51425e'], [.45, '#a47783'], [.76, '#e4a692'], [1, '#f5c895']]);
  c.fillRect(left, topEdge, right - left, bottom - topEdge);
  const skyDepth = Math.max(0, 103 - topEdge);
  for (let i = 0; i < 57; i++) {
    const x = left + ((i * 67) % 127) / 127 * (right - left), y = topEdge + ((i * 43) % 109) / 109 * skyDepth;
    oval(c, x, y, i % 7 ? .58 : .95, i % 7 ? .58 : .95, '#f0c8acb0');
  }
  oval(c, 239, 91, 38, 38, '#f9d497');
  c.save(); c.beginPath(); c.arc(239, 91, 38, 0, tau); c.clip();
  for (let i = 0; i < 8; i++) {
    const y = 95 + i * 4, x = 192 + 5 * Math.sin(i);
    shape(c, `M${x} ${y} q30 -.9 ${48 + i % 3 * 10} .2`, null, '#d6a997', .55 + .12 * i);
  }
  c.restore();
  const ridges = [
    [141, '#b08492', 19, 7, .4], [154, '#946d83', 24, 8, 1.5],
    [178, '#735c78', 26, 10, .7], [204, '#594e68', 27, 9, 1.8], [236, '#44445b', 22, 8, .9]
  ];
  for (const [base, color, roll, fold, phase] of ridges) {
    c.fillStyle = color;
    c.beginPath(); c.moveTo(left, bottom);
    for (let x = left - 3; x <= right + 4; x += 3) {
      const valley = 20 * Math.exp(-Math.pow((x - 200) / 79, 2));
      const y = base + valley + roll * Math.sin(x / 62 + phase * 4) + fold * Math.sin(x / 18 + phase) + 2.2 * Math.sin(x / 5 + phase);
      c.lineTo(x, y);
    }
    c.lineTo(right + 4, bottom); c.closePath(); c.fill();
  }
  // The openings are cut out of a single bridge silhouette, letting the valley show through.
  for (let x = 188 + Math.floor((left - 188) / 59) * 59; x < right; x += 59) {
    shape(c, `M${x} ${deck} h59 V${bottom} h-5 V236 a24.5 32 0 0 0 -49 0 V${bottom} h-5Z`, bridge);
    shape(c, `M${x + 4} 236 a25.5 33 0 0 1 51 0 M${x + 2} 216 v-12 m2 50 v20`, null, mortar, 1.2);
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI + i / 12 * Math.PI, cx = x + 29.5;
      shape(c, `M${cx + 25.6 * Math.cos(a)} ${236 + 33 * Math.sin(a)} l${3.6 * Math.cos(a)} ${4.4 * Math.sin(a)}`, null, '#7c636e', 1);
    }
    for (let k = 0; k < 4; k++) {
      const bx = x + 5 + ((k * 17) % 43), by = 191 + (k % 2) * 4;
      shape(c, `M${bx} ${by} h9 m-4 -.3 v2`, null, '#755f69', .75);
    }
  }
  c.fillStyle = '#b68c88'; c.fillRect(left, deck, right - left, 2);
  c.fillStyle = bridge; c.fillRect(left, deck - 1.2, right - left, 1.3);
  for (let x = left - 10; x < right; x += 9) {
    shape(c, `M${x} 182.8 l3 -.5`, null, '#453548', .9);
  }
  for (let i = 0; i < (right - left) / 10; i++) {
    const x = left + i * 10 + 3 * Math.sin(i * 9);
    const base = 284 - 19 * Math.cos((x - 34) / 72);
    fir(c, x, base, .51 + .41 * (1 + Math.sin(i * 17)), '#393748');
  }
  shape(c, `M${left} ${bottom} V284 Q80 232 151 271 T292 287 T${right} 270 V${bottom}Z`, '#393748');
}

function drawMotion(t) {
  const c = motion, length = 147;
  const p = (t / 8.4 + .51) % 1;
  const front = left - 12 + p * (right - left + length + 32);
  c.save(); c.translate(front, deck - 2);
  for (let i = 0; i < 7; i++) {
    const age = (t / 2.1 + i / 7) % 1;
    c.globalAlpha = .58 * (1 - age);
    const x = -8 - age * 54, y = -21 - age * 25 - 3 * Math.sin(age * Math.PI);
    oval(c, x, y, 1.7 + 6 * age, 1.9 + age * 4.4, '#e7cbb9');
  }
  c.globalAlpha = 1;
  // The locomotive faces right; the warm rectangles stay lit as the carriages enter the cutting.
  for (const x of [-145, -94]) {
    shape(c, `M${x} -3 v-13 q0 -2 3 -2 h39 q3 0 3 3 v12Z`, '#553e4c', '#302b3e', 1);
    shape(c, `M${x - 1} -17 q22 -4 47 0`, null, '#302b3e', 2);
    for (let j = 0; j < 6; j++) {
      c.fillStyle = j % 3 ? windowLight : '#de9d70'; c.fillRect(x + 4 + j * 6.5, -13.5, 4.5, 5.5);
    }
    shape(c, `M${x + 1} -5 h43 m1 1 h6`, null, '#c1836f', 1);
    for (const offset of [8, 36]) oval(c, x + offset, -2, 2.5, 2.5, '#242637');
  }
  shape(c, 'M-48 -3 v-13 h12 v13Z M-38 -4 v-15 h12 v5 h17 q5 1 5 6 v3Z M-12 -13 l-1 -8 h7 l-2 8Z M-10 -4 l6 1 4 4 h-11Z', '#352d3f', '#302738', 1.25);
  shape(c, 'M-39 -20 h14 M-24 -13 h10 M-18 -5 h15', null, '#deaa80', 1.2);
  c.fillStyle = windowLight; c.fillRect(-35, -16, 5.4, 5.5);
  for (const x of [-39, -29, -21, -13]) {
    oval(c, x, -2.8, 3.25, 3.25, '#272637'); oval(c, x, -2.8, 1.3, 1.3, '#ac827b');
  }
  const angle = t * tau / .6;
  shape(c, `M${-29 + Math.sin(angle)} ${-2.8 + Math.cos(angle)} h16`, null, '#c2907a', 1);
  oval(c, -2.5, -9, 1.8, 1.6, '#ffe7b0');
  c.restore();
}

// Reprint the stationary ink only on resize. Motion is a separate transparent sheet.
function redraw(now) {
  motion.clearRect(left - 1, topEdge - 1, right - left + 2, bottom - topEdge + 2);
  drawMotion(reducedMotion.matches ? 0 : now / 1000);
  if (!document.hidden && !reducedMotion.matches) frame = requestAnimationFrame(redraw);
}

function refresh() {
  cancelAnimationFrame(frame);
  if (!innerWidth || !innerHeight) return;
  const density = Math.min(devicePixelRatio || 1, 2);
  const scale = Math.min(innerWidth / 328, innerHeight / 258);
  const halfWidth = innerWidth / (2 * scale), halfHeight = innerHeight / (2 * scale);
  left = 200 - halfWidth; right = 200 + halfWidth;
  topEdge = 150 - halfHeight; bottom = 150 + halfHeight;
  for (const ctx of [print, motion]) {
    ctx.canvas.width = Math.round(innerWidth * density);
    ctx.canvas.height = Math.round(innerHeight * density);
    const sx = ctx.canvas.width / (right - left), sy = ctx.canvas.height / (bottom - topEdge);
    ctx.setTransform(sx, 0, 0, sy, -left * sx, -topEdge * sy);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  drawPrint();
  print.fillStyle = print.createPattern(grainTile, 'repeat');
  print.fillRect(left, topEdge, right - left, bottom - topEdge);
  redraw(performance.now());
}
addEventListener('resize', refresh);
document.addEventListener('visibilitychange', refresh);
reducedMotion.addEventListener('change', refresh);
refresh();
</script>
</body>
</html>
