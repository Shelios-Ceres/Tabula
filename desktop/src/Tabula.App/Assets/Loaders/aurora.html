<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>极光</title>
<!-- Tabula waiting animation: 极光. Original work for the Tabula client, no libraries. -->
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #061424; } canvas { display: block; width: 100%; height: 100%; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c'), x = canvas.getContext('2d');
const PAPER = '#061424', PAINT_MS = 10000, HOLD_MS = 2600;
let W, H, U, queue, next, start, fade;
let seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
function rnd() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const r = (a, b) => a + (b - a) * rnd();
const pick = (list) => list[Math.floor(rnd() * list.length)];
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2;
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
// Paint something at a time (ms) on the timeline.
const at = (time, draw) => queue.push({ time, draw });
function grain(amount, dark) {
  for (let i = 0; i < W * H / 260 * amount; i++) {
    x.fillStyle = dark ? 'rgba(255,255,255,' + r(0.01, 0.05) + ')' : 'rgba(90,70,40,' + r(0.01, 0.05) + ')';
    x.fillRect(r(0, W), r(0, H), r(0.5, 1.6) * U, r(0.5, 1.6) * U);
  }
}
function begin() {
  x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  queue = []; paint(); queue.sort((a, b) => a.time - b.time);
  next = 0; start = performance.now(); fade = 0;
  // ?at=ms paints straight to that moment (previews and stills).
  const jump = +new URLSearchParams(location.search).get('at') || 0;
  while (jump && next < queue.length && queue[next].time <= jump) { x.save(); queue[next++].draw(); x.restore(); }
  start -= jump;
}
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = Math.max(1, Math.round(innerWidth * d)); H = canvas.height = Math.max(1, Math.round(innerHeight * d));
  U = Math.min(W, H) / 400;
  begin();
}
function frame(now) {
  const t = now - start;
  while (next < queue.length && queue[next].time <= t) { x.save(); queue[next++].draw(); x.restore(); }
  if (next >= queue.length && t > PAINT_MS + HOLD_MS) {
    x.globalAlpha = 0.07; x.fillStyle = PAPER; x.fillRect(0, 0, W, H); x.globalAlpha = 1;
    if (++fade > 45) begin();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// Aurora curtains brushed across a starry sky, with a mountain line and their reflection in a still lake.
function paint() {
  const horizon = H * r(0.68, 0.74);
  at(0, () => {
    const g = x.createLinearGradient(0, 0, 0, horizon);
    g.addColorStop(0, '#030b18'); g.addColorStop(1, '#0d2a3a');
    x.fillStyle = g; x.fillRect(0, 0, W, horizon);
    const lake = x.createLinearGradient(0, horizon, 0, H);
    lake.addColorStop(0, '#0b2230'); lake.addColorStop(1, '#030a12');
    x.fillStyle = lake; x.fillRect(0, horizon, W, H - horizon);
    for (let i = 0; i < 260; i++) {
      const sy = r(0, horizon * 0.95);
      x.fillStyle = `rgba(255,255,255,${r(0.2, 0.9)})`; x.beginPath(); x.arc(r(0, W), sy, r(0.3, 1.1) * U, 0, 6.28); x.fill();
    }
  });
  // Mountains on the horizon and their mirror image, redrawn over the light as it builds.
  const range = new Path2D(), mirror = new Path2D();
  const peaks = Array.from({ length: 41 }, (_, i) => horizon - H * (0.03 + 0.06 * Math.abs(Math.sin(i / 40 * r(2.5, 3.5) + 1.3)) + 0.02 * gauss()));
  range.moveTo(0, horizon); mirror.moveTo(0, horizon);
  peaks.forEach((y, i) => { range.lineTo(i / 40 * W, y); mirror.lineTo(i / 40 * W, 2 * horizon - y); });
  range.lineTo(W, horizon); range.closePath(); mirror.lineTo(W, horizon); mirror.closePath();
  const silhouettes = () => { x.fillStyle = '#02060c'; x.fill(range); x.fillStyle = 'rgba(2,6,12,0.8)'; x.fill(mirror); };
  const curtains = Array.from({ length: pick([2, 3]) }, () => ({
    base: H * r(0.3, 0.5), amp: H * r(0.04, 0.1), freq: r(1.2, 2.6), phase: r(0, 6.28), height: H * r(0.18, 0.32),
    hue: pick([['#5ef2a9', '#7c5cff'], ['#6dfcc7', '#3fa8ff'], ['#9dff8a', '#c06bff']]),
  }));
  const streaks = 160, passes = 3;
  for (let p = 0; p < passes; p++) curtains.forEach((cu, ci) => {
    for (let s = 0; s < streaks; s++) {
      const u = s / streaks, time = 500 + (p * curtains.length + ci) * (8400 / (passes * curtains.length)) + s * 18;
      at(time, () => {
        const sx = u * W + r(-3, 3) * U, base = cu.base + Math.sin(u * cu.freq * 6.28 + cu.phase) * cu.amp;
        const h = cu.height * (0.6 + 0.4 * Math.sin(u * 9 + cu.phase + p)), a = 0.05 + 0.04 * rnd();
        x.globalCompositeOperation = 'lighter';
        // A soft lower edge that brightens quickly, then rays fading upward.
        const g = x.createLinearGradient(0, base + h * 0.12, 0, base - h);
        g.addColorStop(0, rgba(cu.hue[0], 0)); g.addColorStop(0.14, rgba(cu.hue[0], a * 1.6)); g.addColorStop(0.45, rgba(cu.hue[0], a)); g.addColorStop(1, rgba(cu.hue[1], 0));
        x.fillStyle = g; x.fillRect(sx, base - h, r(2, 5) * U, h * 1.12);
        // Its reflection, broken by ripples.
        const ry = 2 * horizon - base;
        const rg = x.createLinearGradient(0, ry, 0, ry + h * 0.7);
        rg.addColorStop(0, rgba(cu.hue[0], a * 0.6)); rg.addColorStop(1, rgba(cu.hue[1], 0));
        x.fillStyle = rg; x.fillRect(sx + r(-4, 4) * U, ry, r(2, 5) * U, h * 0.7);
        x.globalCompositeOperation = 'source-over';
        if (s % 20 === 19) silhouettes();
      });
    }
  });
  at(9300, () => {
    silhouettes();
    x.strokeStyle = 'rgba(180,230,255,0.08)'; x.lineWidth = 0.8 * U;
    for (let i = 0; i < 40; i++) { const y = r(horizon + 4 * U, H); const w = r(20, 90) * U, cx = r(0, W); x.beginPath(); x.moveTo(cx - w, y); x.lineTo(cx + w, y); x.stroke(); }
  });
}

</script>
</body>
</html>
